<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Knowledge - Wonton Chili Oil</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Consolas', 'Monospace';
    overflow: hidden;
    background: #000;
  }

.dark-slide {
    background: #000;
    color: #c9d1d9;
  }

.content-slide {
    background: #0a2d2d;
    color: #e0f7f7;
  }

.slide {
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

.slide.active {
    display: flex;
  }

  #code-display,.typing-text {
    font-size: 14px;
    text-align: left;
    max-width: 90%;
    max-height: 80vh;
    white-space: pre-wrap;
    overflow: hidden;
    color: #c9d1d9;
  }

.keyword { color: #ff7b72; }
.function { color: #d2a8ff; }
.string { color: #a5d6ff; }
.number { color: #79c0ff; }
.comment { color: #8d96a0; }
.builtin { color: #ffa657; }

  canvas {
    display: block;
  }

.slide-content {
    max-width: 800px;
    width: 100%;
    text-align: left;
  }

.slide-content h2 {
    color: #00ffd5;
    font-size: 28px;
    margin-bottom: 20px;
    border-bottom: 2px solid #00ffd5;
    padding-bottom: 10px;
  }

.slide-content p,.slide-content li {
    font-size: 20px;
    line-height: 1.6;
    font-family: 'Segoe UI', sans-serif;
  }

.qr-slide {
    text-align: center;
  }

.qr-slide h2 {
    color: #00ffd5;
    font-size: 32px;
    margin-bottom: 30px;
  }

.qr-slide p {
    margin-top: 20px;
    font-size: 18px;
    color: #8d96a0;
    font-family: 'Segoe UI', sans-serif;
  }

.end-slide h1 {
    font-size: 72px;
    color: #00ffd5;
    letter-spacing: 10px;
  }

  @media (max-width: 600px) {
.slide-content h2 { font-size: 22px; }
.slide-content p,.slide-content li { font-size: 16px; }
    #code-display,.typing-text { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="slide dark-slide active" id="slide-code">
  <pre id="code-display"></pre>
</div>

<div class="slide dark-slide" id="slide-heart">
  <canvas id="heartCanvas"></canvas>
</div>

<div id="content-container"></div>

<div class="slide dark-slide qr-slide" id="slide-qr">
  <h2 class="typing-text" id="qr-title"></h2>
  <p class="typing-text" id="qr-desc"></p>
</div>

<div class="slide content-slide end-slide" id="slide-end">
  <h1 class="typing-text" id="end-text"></h1>
</div>

<script>
const QR_LINK = "https://product-knowledge-xi-tsm-ii.vercel.app/";

const slidesData = [
  { title: "Nama Produk", content: "Wonton Daging Chili Oil." },
  { title: "Konsep Produk", content: "Makanan camilan/berat ringan dengan konsep fusion. Wonton isi daging ayam yang disajikan dengan siraman chili oil." },
  { title: "Target Pasar", content: "• Siswa/siswi SMK N 7 KENDAL.\n• Pecinta makanan pedas dan praktis." },
  { title: "Kelebihan Produk", content: "• Rasa : Gurih pedas nendang.\n• Harga : Terjangkau di bawah Rp10.000.\n• Fresh made saat ada pesanan." }
];

let currentSlide = 0;
let isTyping = false;

const container = document.getElementById('content-container');
slidesData.forEach((slide, index) => {
  const div = document.createElement('div');
  div.className = 'slide content-slide';
  div.id = `slide-${index}`;
  div.innerHTML = `
    <div class="slide-content">
      <h2 class="typing-text" id="title-${index}"></h2>
      <p class="typing-text" id="content-${index}"></p>
    </div>
  `;
  container.appendChild(div);
});

const allSlides = document.querySelectorAll('.slide');
const codeDisplay = document.getElementById('code-display');

const codeText = `import numpy as np
import matplotlib.pyplot as plt
import matplotlib.animation as animation

def hearta( k ):
    return 15 * np.sin(k)**3

def heartb( k ):
    return 12*np.cos(k) - 5*np.cos(2*k) - 2*np.cos(3*k) - np.cos(4*k)

fig, ax = plt.subplots()
fig.patch.set_facecolor('black')
ax.set_facecolor('black')
ax.set_xlim(-350, 350)
ax.set_ylim(-350, 350)
ax.set_aspect('equal')
ax.axis('off')

total_frames = 600
t = np.linspace(0, 12*np.pi, total_frames)
x_heart = hearta(t) * 20
y_heart = heartb(t) * 20

points, = ax.plot([], [], 'ro', markersize=2)
lines, = ax.plot([], [], 'r-', lw=0.5, alpha=0.3)

def animate(i):
    xi = x_heart[ : i]
    yi = y_heart[ : i]
    x_lines = []
    y_lines = []
    for j in range(i):
        x_lines.extend ( [0, x_heart[j], None])
        y_lines.extend ( [0, y_heart[j], None])
    points.set_data(xi, yi)
    lines.set_data(x_lines, y_lines)
    return points, lines

ani = animation.FuncAnimation(fig, animate, frames=total_frames, interval=10, blit=True, repeat=False)

plt.show( )`;

function highlightCode(code) {
  return code
.replace(/(\#.*)/g, '<span class="comment">$1</span>')
.replace(/\b(def|import|return|for|in|if|from|as)\b/g, '<span class="keyword">$1</span>')
.replace(/\b(np|plt|animation|fig|ax)\b/g, '<span class="builtin">$1</span>')
.replace(/\b(hearta|heartb|animate)\b/g, '<span class="function">$1</span>')
.replace(/('[^']*')/g, '<span class="string">$1</span>')
.replace(/\b(\d+)\b/g, '<span class="number">$1</span>');
}

function typeText(element, text, speed, callback) {
  let i = 0;
  isTyping = true;
  element.textContent = '';

  const interval = setInterval(() => {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
    } else {
      clearInterval(interval);
      isTyping = false;
      if (callback) setTimeout(callback, 800);
    }
  }, speed);
}

function typeCode() {
  let i = 0;
  isTyping = true;
  let displayedCode = '';

  const interval = setInterval(() => {
    if (i < codeText.length) {
      displayedCode += codeText.charAt(i);
      codeDisplay.innerHTML = highlightCode(displayedCode);
      i++;
    } else {
      clearInterval(interval);
      isTyping = false;
      setTimeout(nextSlide, 1000);
    }
  }, 15);
}

function drawHeartPoints() {
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const points = [];
  for (let t = 0; t < Math.PI * 2; t += 0.02) {
    const px = 16 * Math.sin(t) * Math.sin(t) * Math.sin(t);
    const py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    points.push({
      x: canvas.width / 2 + px * 20,
      y: canvas.height / 2 - py * 20
    });
  }

  let i = 0;
  const interval = setInterval(() => {
    if (i < points.length) {
      ctx.fillStyle = '#ff2d55';
      ctx.beginPath();
      ctx.arc(points[i].x, points[i].y, 2, 0, Math.PI * 2);
      ctx.fill();
      i++;
    } else {
      clearInterval(interval);
      setTimeout(nextSlide, 1000);
    }
  }, 15);
}

function showQR() {
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const qrSize = 200;
  const qrX = canvas.width / 2 - qrSize / 2;
  const qrY = canvas.height / 2 - qrSize / 2;

  const qrImg = new Image();
  qrImg.crossOrigin = "Anonymous";
  qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encodeURIComponent(QR_LINK)}`;

  qrImg.onload = () => {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = qrSize;
    tempCanvas.height = qrSize;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(qrImg, 0, 0);
    const imageData = tempCtx.getImageData(0, 0, qrSize, qrSize).data;

    const qrPoints = [];
    for (let y = 0; y < qrSize; y += 3) {
      for (let x = 0; x < qrSize; x += 3) {
        const index = (y * qrSize + x) * 4;
        if (imageData[index] < 128) {
          qrPoints.push({x: qrX + x, y: qrY + y});
        }
      }
    }

    let i = 0;
    const interval = setInterval(() => {
      if (i < qrPoints.length) {
        ctx.fillStyle = '#00ffd5';
        ctx.beginPath();
        ctx.arc(qrPoints[i].x, qrPoints[i].y, 2, 0, Math.PI * 2);
        ctx.fill();
        i++;
      } else {
        clearInterval(interval);
        typeText(document.getElementById('qr-title'), 'Scan QR Code', 40, () => {
          typeText(document.getElementById('qr-desc'), QR_LINK, 20, () => {
            setTimeout(nextSlide, 4000);
          });
        });
      }
    }, 8);
  };

  typeText(document.getElementById('qr-title'), 'Membentuk QR CODE...', 40);
}

function nextSlide() {
  if (currentSlide < allSlides.length - 1) {
    allSlides[currentSlide].classList.remove('active');
    currentSlide++;
    allSlides[currentSlide].classList.add('active');

    if (currentSlide === 1) {
      drawHeartPoints();
    } else if (currentSlide >= 2 && currentSlide < allSlides.length - 2) {
      const index = currentSlide - 2;
      const titleEl = document.getElementById(`title-${index}`);
      const contentEl = document.getElementById(`content-${index}`);

      typeText(titleEl, slidesData[index].title, 30, () => {
        typeText(contentEl, slidesData[index].content, 20, () => {
          setTimeout(nextSlide, 1500);
        });
      });
    } else if (currentSlide === allSlides.length - 2) {
      showQR();
    } else if (currentSlide === allSlides.length - 1) {
      typeText(document.getElementById('end-text'), 'END', 100);
    }
  }
}

typeCode();
</script>
</body>
</html>
