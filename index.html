<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Knowledge - Wonton Chili Oil</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Consolas', 'Monospace';
    overflow: hidden;
    background: #000;
  }

.dark-slide {
    background: #000;
    color: #c9d1d9;
  }

.content-slide {
    background: #0a2d2d;
    color: #e0f7f7;
  }

.slide {
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
  }

.slide.active {
    display: flex;
  }

  #code-display,.typing-text {
    font-size: 14px;
    text-align: left;
    max-width: 90%;
    max-height: 80vh;
    white-space: pre-wrap;
    overflow: hidden;
    color: #c9d1d9;
  }

.keyword { color: #ff7b72; }
.function { color: #d2a8ff; }
.string { color: #a5d6ff; }
.number { color: #79c0ff; }
.comment { color: #8d96a0; }
.builtin { color: #ffa657; }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

.slide-content {
    max-width: 800px;
    width: 100%;
    text-align: left;
    z-index: 2;
  }

.slide-content h2 {
    color: #00ffd5;
    font-size: 28px;
    margin-bottom: 20px;
    border-bottom: 2px solid #00ffd5;
    padding-bottom: 10px;
  }

.slide-content p,.slide-content li {
    font-size: 20px;
    line-height: 1.6;
    font-family: 'Segoe UI', sans-serif;
  }

.qr-slide {
    text-align: center;
  }

.qr-slide h2,.qr-slide p {
    z-index: 2;
    position: relative;
  }

.qr-slide h2 {
    color: #00ffd5;
    font-size: 32px;
    margin-bottom: 30px;
  }

.qr-slide p {
    margin-top: 20px;
    font-size: 18px;
    color: #8d96a0;
    font-family: 'Segoe UI', sans-serif;
  }

.end-slide h1 {
    font-size: 72px;
    color: #00ffd5;
    letter-spacing: 10px;
    z-index: 2;
    position: relative;
  }

  @media (max-width: 600px) {
.slide-content h2 { font-size: 22px; }
.slide-content p,.slide-content li { font-size: 16px; }
    #code-display,.typing-text { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="slide dark-slide active" id="slide-code">
  <pre id="code-display"></pre>
</div>

<div class="slide dark-slide" id="slide-heart">
  <canvas id="heartCanvas"></canvas>
</div>

<div id="content-container"></div>

<div class="slide dark-slide qr-slide" id="slide-qr">
  <canvas id="qrCanvas"></canvas>
  <h2 class="typing-text" id="qr-title"></h2>
  <p class="typing-text" id="qr-desc"></p>
</div>

<div class="slide content-slide end-slide" id="slide-end">
  <h1 class="typing-text" id="end-text"></h1>
</div>

<script>
const QR_LINK = "https://product-knowledge-xi-tsm-ii.vercel.app/";

const slidesData = [
  { title: "Nama Produk", content: "Wonton Daging Chili Oil." },
  { title: "Konsep Produk", content: "Makanan camilan/berat ringan dengan konsep fusion. Wonton isi daging ayam yang disajikan dengan siraman chili oil." },
  { title: "Target Pasar", content: "• Siswa/siswi SMK N 7 KENDAL.\n• Pecinta makanan pedas dan praktis." },
  { title: "Kelebihan Produk", content: "• Rasa : Gurih pedas nendang.\n• Harga : Terjangkau di bawah Rp10.000.\n• Fresh made saat ada pesanan." }
];

let currentSlide = 0;
let isTyping = false;

const container = document.getElementById('content-container');
slidesData.forEach((slide, index) => {
  const div = document.createElement('div');
  div.className = 'slide content-slide';
  div.id = `slide-${index}`;
  div.innerHTML = `
    <div class="slide-content">
      <h2 class="typing-text" id="title-${index}"></h2>
      <p class="typing-text" id="content-${index}"></p>
    </div>
  `;
  container.appendChild(div);
});

const allSlides = document.querySelectorAll('.slide');
const codeDisplay = document.getElementById('code-display');

const codeText = `import numpy as np
import matplotlib.pyplot as plt
import matplotlib.animation as animation

def hearta( k ):
    return 15 * np.sin(k)**3

def heartb( k ):
    return 12*np.cos(k) - 5*np.cos(2*k) - 2*np.cos(3*k) - np.cos(4*k)

fig, ax = plt.subplots()
fig.patch.set_facecolor('black')
ax.set_facecolor('black')
ax.set_xlim(-350, 350)
ax.set_ylim(-350, 350)
ax.set_aspect('equal')
ax.axis('off')

total_frames = 600
t = np.linspace(0, 12*np.pi, total_frames)
x_heart = hearta(t) * 20
y_heart = heartb(t) * 20

points, = ax.plot([], [], 'ro', markersize=2)
lines, = ax.plot([], [], 'r-', lw=0.5, alpha=0.3)

def animate(i):
    xi = x_heart[ : i]
    yi = y_heart[ : i]
    x_lines = []
    y_lines = []
    for j in range(i):
        x_lines.extend ( [0, x_heart[j], None])
        y_lines.extend ( [0, y_heart[j], None])
    points.set_data(xi, yi)
    lines.set_data(x_lines, y_lines)
    return points, lines

ani = animation.FuncAnimation(fig, animate, frames=total_frames, interval=10, blit=True, repeat=False)

plt.show( )`;

function highlightCode(code) {
  return code
.replace(/(\#.*)/g, '<span class="comment">$1</span>')
.replace(/\b(def|import|return|for|in|if|from|as)\b/g, '<span class="keyword">$1</span>')
.replace(/\b(np|plt|animation|fig|ax)\b/g, '<span class="builtin">$1</span>')
.replace(/\b(hearta|heartb|animate)\b/g, '<span class="function">$1</span>')
.replace(/('[^']*')/g, '<span class="string">$1</span>')
.replace(/\b(\d+)\b/g, '<span class="number">$1</span>');
}

function typeText(element, text, speed, callback) {
  let i = 0;
  isTyping = true;
  element.textContent = '';

  const interval = setInterval(() => {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
    } else {
      clearInterval(interval);
      isTyping = false;
      if (callback) setTimeout(callback, 800);
    }
  }, speed);
}

function typeCode() {
  let i = 0;
  isTyping = true;
  let displayedCode = '';

  const interval = setInterval(() => {
    if (i < codeText.length) {
      displayedCode += codeText.charAt(i);
      codeDisplay.innerHTML = highlightCode(displayedCode);
      i++;
    } else {
      clearInterval(interval);
      isTyping = false;
      setTimeout(nextSlide, 1000);
    }
  }, 15);
}

function drawHeartPoints() {
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const points = [];
  for (let t = 0; t < Math.PI * 2; t += 0.02) {
    const px = 16 * Math.sin(t) * Math.sin(t) * Math.sin(t);
    const py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    points.push({
      x: canvas.width / 2 + px * 20,
      y: canvas.height / 2 - py * 20
    });
  }

  let i = 0;
  const interval = setInterval(() => {
    if (i < points.length) {
      ctx.fillStyle = '#ff2d55';
      ctx.beginPath();
      ctx.arc(points[i].x, points[i].y, 2, 0, Math.PI * 2);
      ctx.fill();
      i++;
    } else {
      clearInterval(interval);
      setTimeout(nextSlide, 1000);
    }
  }, 15);
}

function showQR() {
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const qrSize = 280;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2 + 80;
   
  const butterflies = [];
  for (let i = 0; i < 10; i++) {
    butterflies.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      tx: centerX - qrSize/2 + Math.random() * qrSize,
      ty: centerY - qrSize/2 + Math.random() * qrSize,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      angle: Math.random() * Math.PI * 2,
      wingPhase: Math.random() * Math.PI * 2,
      size: 18 + Math.random() * 6,
      pollen: []
    });
  }

  let frame = 0;
  const totalFrames = 120;
  const qrImg = new Image();
  qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encodeURIComponent(QR_LINK)}`;

  function drawButterfly(b, alpha) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.globalAlpha = alpha;

    ctx.fillStyle = '#9b30ff';
    ctx.beginPath();
    ctx.ellipse(-b.size/2, 0, b.size, b.size*0.8, -0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(b.size/2, 0, b.size, b.size*0.8, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#4b0082';
    ctx.beginPath();
    ctx.ellipse(0, 0, b.size*0.25, b.size*0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(155, 48, 255, 0.4)';
    ctx.beginPath();
    ctx.ellipse(-b.size/2, 0, b.size*0.9, b.size*0.6, -0.4 + Math.sin(b.wingPhase) * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(b.size/2, 0, b.size*0.9, b.size*0.6, 0.4 - Math.sin(b.wingPhase) * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (Math.random() < 0.4) {
      b.pollen.push({
        x: b.x + (Math.random() - 0.5) * 12,
        y: b.y + (Math.random() - 0.5) * 12,
        life: 35
      });
    }
  }

  function drawPollen() {
    butterflies.forEach(b => {
      b.pollen = b.pollen.filter(p => {
        p.life--;
        p.y += 0.6;
        const alpha = p.life / 35;
        ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        return p.life > 0;
      });
    });
  }

  function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawPollen();

    butterflies.forEach(b => {
      if (frame < 80) {
        b.x += b.vx;
        b.y += b.vy;
        b.vx += (Math.random() - 0.5) * 0.3;
        b.vy += (Math.random() - 0.5) * 0.3;
        b.angle += 0.03;
        b.wingPhase += 0.25;

        if (b.x < -60 || b.x > canvas.width + 60) b.vx *= -1;
        if (b.y < -60 || b.y > canvas.height + 60) b.vy *= -1;
      } else {
        const dx = b.tx - b.x;
        const dy = b.ty - b.y;
        b.vx += dx * 0.0015;
        b.vy += dy * 0.0015;
        b.vx *= 0.96;
        b.vy *= 0.96;
        b.x += b.vx;
        b.y += b.vy;
        b.angle = Math.atan2(b.vy, b.vx);
        b.wingPhase += 0.15;
      }

      const alpha = frame < 80? 1 : 1 - ((frame - 80) / 40) * 0.7;
      drawButterfly(b, alpha);
    });

    frame++;
    if (frame < totalFrames) {
      requestAnimationFrame(animate);
    } else {
      qrImg.onload = () => {
        ctx.drawImage(qrImg, centerX - qrSize/2, centerY - qrSize/2);
      };
    }
  }
  animate();

  typeText(document.getElementById('qr-title'), 'Scan QR Code', 40);
  typeText(document.getElementById('qr-desc'), QR_LINK, 20);
  setTimeout(nextSlide, 7000);
}

function nextSlide() {
  if (currentSlide < allSlides.length - 1) {
    allSlides[currentSlide].classList.remove('active');
    currentSlide++;
    allSlides[currentSlide].classList.add('active');

    if (currentSlide === 1) {
      drawHeartPoints();
    } else if (currentSlide >= 2 && currentSlide < allSlides.length - 2) {
      const index = currentSlide - 2;
      const titleEl = document.getElementById(`title-${index}`);
      const contentEl = document.getElementById(`content-${index}`);

      typeText(titleEl, slidesData[index].title, 30, () => {
        typeText(contentEl, slidesData[index].content, 20, () => {
          setTimeout(nextSlide, 1500);
        });
      });
    } else if (currentSlide === allSlides.length - 2) {
      setTimeout(showQR, 100);
    } else if (currentSlide === allSlides.length - 1) {
      typeText(document.getElementById('end-text'), 'END', 100);
    }
  }
}

typeCode();
</script>
</body>
</html>
