<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Knowledge - Wonton Chili Oil</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Consolas', 'Monospace';
    overflow: hidden;
  }

  .dark-slide {
    background: #000;
    color: #00ff88;
  }

  .content-slide {
    background: #0a2d2d;
    color: #e0f7f7;
  }

  .slide {
    width: 100vw;
    height: 100vh;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    transition: opacity 0.8s ease;
  }

  .slide.active {
    display: flex;
  }

  #code-display {
    font-size: 14px;
    text-align: left;
    max-width: 90%;
    max-height: 80vh;
    white-space: pre-wrap;
    overflow: hidden;
  }

  canvas {
    display: block;
  }

  .loading-text {
    color: #ff2d55;
    font-size: 18px;
    margin-top: 20px;
    letter-spacing: 3px;
    animation: blink 1.2s infinite;
    font-family: 'Segoe UI', sans-serif;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .slide-content {
    max-width: 800px;
    width: 100%;
    text-align: left;
  }

  .slide-content h2 {
    color: #00ffd5;
    font-size: 28px;
    margin-bottom: 20px;
    border-bottom: 2px solid #00ffd5;
    padding-bottom: 10px;
  }

  .slide-content p, .slide-content li {
    font-size: 20px;
    line-height: 1.6;
    font-family: 'Segoe UI', sans-serif;
  }

  .slide-content ul, .slide-content ol {
    margin-left: 25px;
    margin-top: 15px;
  }

  .slide-content li {
    margin-bottom: 10px;
  }

  .slide-content strong {
    color: #00ffd5;
  }

  .end-slide h1 {
    font-size: 72px;
    color: #00ffd5;
    letter-spacing: 10px;
    animation: glow 2s infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 20px #00ffd5; }
    50% { text-shadow: 0 0 40px #00ffd5, 0 0 60px #00ffd5; }
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: currentColor;
    animation: blink 1s infinite;
  }

  @media (max-width: 600px) {
    .slide-content h2 { font-size: 22px; }
    .slide-content p, .slide-content li { font-size: 16px; }
    #code-display { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="slide dark-slide active" id="slide-code">
  <pre id="code-display"></pre>
</div>

<div class="slide dark-slide" id="slide-heart">
  <canvas id="heartCanvas"></canvas>
  <div class="loading-text">Loading...</div>
</div>

<div id="content-container"></div>

<div class="slide content-slide end-slide" id="slide-end">
  <h1>END</h1>
</div>
